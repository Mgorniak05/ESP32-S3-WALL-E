<!DOCTYPE html>
<html>
<head>
    <title>Rover Telemetry</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background-color: #121212; color: #00ff00; text-align: center; margin: 0; padding: 20px; }
        h1 { color: #ffffff; }
        .dashboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; max-width: 800px; margin: 0 auto; }
        .card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 20px; box-shadow: 0 4px 8px rgba(0,255,0,0.1); }
        .value { font-size: 2em; font-weight: bold; margin-top: 10px; color: #00ff00; }
        .status-dot { height: 15px; width: 15px; background-color: red; border-radius: 50%; display: inline-block; margin-right: 10px; }
        .connected { background-color: #00ff00; box-shadow: 0 0 10px #00ff00; }
        .controls { grid-column: span 2; font-size: 0.8em; color: #888; }
    </style>
</head>
<body>
    <h1>Rover Command Center</h1>
    <p><span id="status-dot" class="status-dot"></span><span id="status-text">Rozłączony</span></p>

    <div class="dashboard">
        <div class="card">
            <div>AKTUALNY RUCH</div>
            <div id="dir-val" class="value">STOP</div>
        </div>
        <div class="card">
            <div>MOC SILNIKÓW</div>
            <div id="pwr-val" class="value">0%</div>
        </div>
        <div class="card">
            <div>NAPIĘCIE BATERII (2S)</div>
            <div id="bat-val" class="value" style="color: #ff9900;">Brak czujnika</div>
        </div>
        <div class="card">
            <div>POBÓR PRĄDU</div>
            <div id="amp-val" class="value" style="color: #ff9900;">Brak czujnika</div>
        </div>
        <div class="controls card">
            STEROWANIE: [W] Przód | [S] Tył | [A] Lewo | [D] Prawo | [Q] Boost | Puszczenie klawisza: Stop
        </div>
    </div>

    <script>
        const ipRobota = "192.168.100.37";
        let ws;
        const keys = ['w', 's', 'a', 'd', 'q'];

        function connect() {
            ws = new WebSocket(`ws://${ipRobota}:81/`);
            
            ws.onopen = () => {
                document.getElementById('status-text').innerText = "POŁĄCZONY";
                document.getElementById('status-dot').classList.add('connected');
            };
            
            ws.onclose = () => {
                document.getElementById('status-text').innerText = "ROZŁĄCZONY";
                document.getElementById('status-dot').classList.remove('connected');
                setTimeout(connect, 1000); 
            };
            
            ws.onmessage = (event) => {
                let dane = event.data.split(',');
                if(dane.length === 2) {
                    document.getElementById('dir-val').innerText = dane[0];
                    document.getElementById('pwr-val').innerText = dane[1] + '%';
                }
            };
        }

        connect();

        document.addEventListener('keydown', (event) => {
            if (event.repeat) return; 
            let key = event.key.toLowerCase();
            
            if (key === 'w') ws.send('Forward');
            if (key === 's') ws.send('Backward');
            if (key === 'a') ws.send('Left');
            if (key === 'd') ws.send('Right');
            if (key === 'q') ws.send('Boost');
        });

        document.addEventListener('keyup', (event) => {
            let key = event.key.toLowerCase();
            if (keys.includes(key)) {
                ws.send('Stop');
            }
        });
    </script>
</body>
</html>
